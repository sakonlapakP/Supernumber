# 🚀 Production Deployment Workflow
name: 🚀 Auto Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploying to Production
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔔 Telegram Notification (Start)
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      run: |
        MSG="รายงานสถานะการ Deploy Website Supernumber ครับพี่อั้ม 🚀 ตอนนี้กำลังเริ่มนำโค้ดล่าสุดขึ้นเซิร์ฟเวอร์ครับ 💬 Commit: ${{ github.event.head_commit.message }}"
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
             -d chat_id="${TELEGRAM_TO}" \
             --data-urlencode "text=$MSG"
        
        # 🎙️ ส่งเสียงประกาศที่เครื่อง Mac
        curl -s -X POST "https://miscellaneous-terminal-helped-reflections.trycloudflare.com/announce" \
        -H "Content-Type: application/json" \
        -d "{\"project\": \"Supernumber\", \"message\": \"กำลังเริ่ม Deploy เว็บไซต์ซูเปอร์นัมเบอร์ครับพี่อั้ม\", \"apiKey\": \"efaum-secret-key-789\"}"
      continue-on-error: true

    - name: 🔍 Check and Clean FTP Sync State
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        echo "Checking if the remote .ftp-deploy-sync-state.json commit is present in local history..."
        curl -s -f -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
          "ftp://${FTP_SERVER}/domains/supernumber.co.th/public_html/.ftp-deploy-sync-state.json" \
          -o local-state.json || true
        
        if [ -f local-state.json ]; then
          LAST_SHA=$(jq -r '.ref' local-state.json 2>/dev/null || echo "")
          if [ ! -z "$LAST_SHA" ] && [ "$LAST_SHA" != "null" ]; then
            echo "Found last deployed commit: $LAST_SHA"
            if ! git cat-file -e "$LAST_SHA" 2>/dev/null; then
              echo "⚠️ Commit $LAST_SHA is not found in the current git history."
              echo "Deleting .ftp-deploy-sync-state.json from the FTP server to force a full clean sync..."
              curl -s -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
                "ftp://${FTP_SERVER}/domains/supernumber.co.th/public_html/" \
                -Q "DELE .ftp-deploy-sync-state.json" || echo "Failed to delete state file."
            else
              echo "✅ Commit $LAST_SHA exists in git history. Proceeding with incremental sync."
            fi
          else
            echo "State file was empty or invalid JSON."
          fi
        else
          echo "No existing state file found on FTP server."
        fi
      continue-on-error: true

    - name: 📂 Sync to public_html
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: domains/supernumber.co.th/public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/storage/*.pdf
          .github/workflows/**
          README.md
          .env

    - name: 🔧 Run Laravel Optimization
      uses: appleboy/ssh-action@master
      continue-on-error: true
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd domains/supernumber.co.th/public_html
          php artisan optimize:clear
          php artisan cache:clear
          php artisan config:clear

    - name: 🌐 Run Web-Trigger Cache Clear (Alternative)
      env:
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
      run: |
        echo "Triggering cache clear via web endpoint..."
        curl -s -f "https://supernumber.co.th/cron/clear-all-caches/${CRON_SECRET}" || echo "Web cache clear not triggered (Secret may not be set in GitHub secrets)"
      continue-on-error: true

    - name: 📝 Prepare Notification Message
      id: prepare_msg
      if: always()
      run: |
        RUN_ID=${{ github.run_number }}
        MOD=$((RUN_ID % 5))
        COMMIT_MSG="${{ github.event.head_commit.message }}"
        STATUS="${{ job.status }}"
        
        if [ "$STATUS" == "success" ]; then
          case $MOD in
            0) MSG="รายงานสถานะการ Deploy Website Supernumber ครับพี่อั้ม ตอนนี้ดำเนินการเสร็จสิ้นแล้วครับ ผลคือ สำเร็จเรียบร้อย ในการอัปเดตเรื่อง $COMMIT_MSG ครับผม" ;;
            1) MSG="พี่อั้มครับ ระบบ Supernumber รายงานตัวครับ ตอนนี้การ Deploy สำเร็จแล้วครับ ในส่วนของ $COMMIT_MSG" ;;
            2) MSG="อัปเดตสถานะครับพี่อั้ม การนำโค้ดเรื่อง $COMMIT_MSG ขึ้นระบบ Supernumber ผลออกมาคือ เรียบร้อยดีครับ" ;;
            3) MSG="เรียบร้อยครับพี่อั้ม การ Deploy เรื่อง $COMMIT_MSG เข้าสู่ Supernumber ตอนนี้ สำเร็จแล้วครับ" ;;
            4) MSG="แจ้งข่าวดีครับพี่อั้ม ระบบจัดการเรื่อง $COMMIT_MSG ให้ Supernumber ผลคือ สำเร็จเรียบร้อยครับผม" ;;
          esac
        else
          case $MOD in
            0) MSG="รายงานสถานะการ Deploy Website Supernumber ครับพี่อั้ม ตอนนี้ดำเนินการเสร็จสิ้นแล้วครับ ผลคือ ไม่สำเร็จ ในการอัปเดตเรื่อง $COMMIT_MSG ครับผม" ;;
            1) MSG="พี่อั้มครับ ระบบ Supernumber แจ้งเตือนครับ ตอนนี้การ Deploy มีปัญหาเล็กน้อยครับ ในส่วนของ $COMMIT_MSG" ;;
            2) MSG="อัปเดตสถานะครับพี่อั้ม การนำโค้ดเรื่อง $COMMIT_MSG ขึ้นระบบ Supernumber ผลออกมาคือ ขัดข้องครับ" ;;
            3) MSG="ขออภัยครับพี่อั้ม การ Deploy เรื่อง $COMMIT_MSG เข้าสู่ Supernumber ตอนนี้ ยังไม่สำเร็จนะครับ" ;;
            4) MSG="แจ้งข่าวครับพี่อั้ม ระบบจัดการเรื่อง $COMMIT_MSG ให้ Supernumber ผลคือ ยังไม่สำเร็จครับผม" ;;
          esac
        fi
        
        # Add Emoji based on status for visual feedback
        if [ "$STATUS" == "success" ]; then
          MSG="$MSG ✅"
        else
          MSG="$MSG ❌"
        fi
        
        # Output the final message
        echo "msg=$MSG" >> $GITHUB_OUTPUT

    - name: 🔔 Telegram Notification (Finish)
      if: always()
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      run: |
        MSG="${{ steps.prepare_msg.outputs.msg }}"
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
             -d chat_id="${TELEGRAM_TO}" \
             --data-urlencode "text=$MSG"

        # 🎙️ ส่งเสียงประกาศที่เครื่อง Mac (ตอนจบ)
        curl -s -X POST "https://miscellaneous-terminal-helped-reflections.trycloudflare.com/announce" \
        -H "Content-Type: application/json" \
        -d "{\"project\": \"Supernumber\", \"message\": \"$MSG\", \"apiKey\": \"efaum-secret-key-789\"}"
      continue-on-error: true








