# 🚀 Production Deployment Workflow
name: 🚀 Auto Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploying to Production
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔔 Telegram Notification (Start)
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      run: |
        COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
        MSG="รายงานสถานะการ Deploy Website Supernumber ครับพี่อั้ม 🚀 ตอนนี้กำลังเริ่มนำโค้ดล่าสุดขึ้นเซิร์ฟเวอร์ครับ 💬 Commit: ${COMMIT_MSG}"
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
             -d chat_id="${TELEGRAM_TO}" \
             --data-urlencode "text=${MSG}"

        curl -s -X POST "https://miscellaneous-terminal-helped-reflections.trycloudflare.com/announce" \
        -H "Content-Type: application/json" \
        -d "{\"project\": \"Supernumber\", \"message\": \"กำลังเริ่ม Deploy เว็บไซต์ซูเปอร์นัมเบอร์ครับพี่อั้ม\", \"apiKey\": \"efaum-secret-key-789\"}"
      continue-on-error: true

    - name: 🗑 Delete stale FTP sync state (force full sync)
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        curl -s -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
          "ftp://${FTP_SERVER}/domains/supernumber.co.th/public_html/.ftp-deploy-sync-state.json" \
          -Q "DELE /domains/supernumber.co.th/public_html/.ftp-deploy-sync-state.json" || true
        echo "State file deleted (or did not exist) — FTP will do full sync."
      continue-on-error: true

    - name: 📂 Sync to public_html
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: domains/supernumber.co.th/public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/storage/*.pdf
          .github/workflows/**
          README.md
          .env

    - name: 🔧 Run Laravel Optimization
      uses: appleboy/ssh-action@master
      continue-on-error: true
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd domains/supernumber.co.th/public_html
          php artisan optimize:clear
          php artisan cache:clear
          php artisan config:clear

    - name: 🌐 Run Web-Trigger Cache Clear (Alternative)
      env:
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
      run: |
        curl -s "https://supernumber.co.th/cron/clear-all-caches/${CRON_SECRET}" || true
      continue-on-error: true

    - name: 📝 Prepare Notification Message
      id: prepare_msg
      if: always()
      run: |
        RUN_ID=${{ github.run_number }}
        MOD=$((RUN_ID % 5))
        COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1 | sed "s/['\"]//g")
        STATUS="${{ job.status }}"

        if [ "$STATUS" == "success" ]; then
          case $MOD in
            0) MSG="รายงานสถานะการ Deploy Website Supernumber ครับพี่อั้ม ตอนนี้ดำเนินการเสร็จสิ้นแล้วครับ ผลคือ สำเร็จเรียบร้อย ในการอัปเดตเรื่อง ${COMMIT_MSG} ครับผม ✅" ;;
            1) MSG="พี่อั้มครับ ระบบ Supernumber รายงานตัวครับ ตอนนี้การ Deploy สำเร็จแล้วครับ ในส่วนของ ${COMMIT_MSG} ✅" ;;
            2) MSG="อัปเดตสถานะครับพี่อั้ม การนำโค้ดเรื่อง ${COMMIT_MSG} ขึ้นระบบ Supernumber ผลออกมาคือ เรียบร้อยดีครับ ✅" ;;
            3) MSG="เรียบร้อยครับพี่อั้ม การ Deploy เรื่อง ${COMMIT_MSG} เข้าสู่ Supernumber ตอนนี้ สำเร็จแล้วครับ ✅" ;;
            4) MSG="แจ้งข่าวดีครับพี่อั้ม ระบบจัดการเรื่อง ${COMMIT_MSG} ให้ Supernumber ผลคือ สำเร็จเรียบร้อยครับผม ✅" ;;
          esac
        else
          case $MOD in
            0) MSG="รายงานสถานะการ Deploy Website Supernumber ครับพี่อั้ม ตอนนี้ดำเนินการเสร็จสิ้นแล้วครับ ผลคือ ไม่สำเร็จ ในการอัปเดตเรื่อง ${COMMIT_MSG} ครับผม ❌" ;;
            1) MSG="พี่อั้มครับ ระบบ Supernumber แจ้งเตือนครับ ตอนนี้การ Deploy มีปัญหาเล็กน้อยครับ ในส่วนของ ${COMMIT_MSG} ❌" ;;
            2) MSG="อัปเดตสถานะครับพี่อั้ม การนำโค้ดเรื่อง ${COMMIT_MSG} ขึ้นระบบ Supernumber ผลออกมาคือ ขัดข้องครับ ❌" ;;
            3) MSG="ขออภัยครับพี่อั้ม การ Deploy เรื่อง ${COMMIT_MSG} เข้าสู่ Supernumber ตอนนี้ ยังไม่สำเร็จนะครับ ❌" ;;
            4) MSG="แจ้งข่าวครับพี่อั้ม ระบบจัดการเรื่อง ${COMMIT_MSG} ให้ Supernumber ผลคือ ยังไม่สำเร็จครับผม ❌" ;;
          esac
        fi

        echo "msg<<MSGEOF" >> $GITHUB_OUTPUT
        echo "$MSG" >> $GITHUB_OUTPUT
        echo "MSGEOF" >> $GITHUB_OUTPUT

    - name: 🔔 Telegram Notification (Finish)
      if: always()
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      run: |
        MSG="${{ steps.prepare_msg.outputs.msg }}"
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
             -d chat_id="${TELEGRAM_TO}" \
             --data-urlencode "text=${MSG}"

        curl -s -X POST "https://miscellaneous-terminal-helped-reflections.trycloudflare.com/announce" \
        -H "Content-Type: application/json" \
        -d "{\"project\": \"Supernumber\", \"message\": \"${MSG}\", \"apiKey\": \"efaum-secret-key-789\"}"
      continue-on-error: true
